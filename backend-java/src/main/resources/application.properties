server.port=8080
spring.application.name=pulseforge-api
server.error.include-message=always

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/pulseforge;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.flyway.enabled=true
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.serialization.write-dates-as-timestamps=false

demo.service.url=${DEMO_SERVICE_URL:http://localhost:8081}
pulseforge.request-timeout-seconds=10
pulseforge.max-users=500
pulseforge.max-duration-seconds=600

logging.level.com.pulseforge=INFO
